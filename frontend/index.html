<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Crypto Wallet</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
    <div class="logo">LiveCrypto</div>
    <div class="links">
        <a href="#">GitHub</a>
        <a href="#">About</a>
    </div>
</header>

<section class="hero">
    <h1>Live Cryptocurrency Prices</h1>
    <p>Real-time data from CoinGecko API</p>
</section>

<section class="main-btc">
    <div class="coin-card big">
        <div class="coin-name">BTC • Bitcoin</div>
        <div class="price">$43,210.22</div>
    </div>
</section>

<section class="coins-grid">
    <div class="coin-card">
        <div class="coin-name">ETH • Ethereum</div>
        <div class="price">$2,310.45</div>
    </div>

    <div class="coin-card">
        <div class="coin-name">SOL • Solana</div>
        <div class="price">$102.11</div>
    </div>
